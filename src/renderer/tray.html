<!doctype html>
<html class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Cronus Tray</title>
    <style>
      html {
        color-scheme: dark;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }

      #root {
        width: 100%;
        height: 100%;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Fallback colors in case CSS is not loaded */
      html.dark {
        --background: 0 0% 3.9%;
        --foreground: 0 0% 98%;
        --card: 0 0% 3.9%;
        --card-foreground: 0 0% 98%;
        --border: 0 0% 14.9%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/trayRenderer.tsx"></script>
  </body>
</html>
